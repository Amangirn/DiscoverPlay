<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DiscoverPlay</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css?v=20261107-2">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(18, 18, 18, 0.8), rgba(18, 18, 18, 0.9)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1920&q=80') center/cover;
        }
        .auth-card {
            background-color: var(--dp-bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
    
        .password-input-wrapper .password-toggle { right: .35rem; padding: .25rem .5rem; }
        .password-input-wrapper .password-toggle:focus { box-shadow: none; }
    </style>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon" sizes="any">
</head>
<body>

    <!-- Back to Home -->
    <div class="position-absolute top-0 start-0 p-4">
        <a href="../index.html" class="text-white text-decoration-none d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Register Section -->
    <div class="auth-wrapper py-5">
        <div class="auth-card">
            <div class="text-center mb-4">
                <img src="../images/logo.png" alt="DiscoverPlay Logo" style="height: 50px;" class="mb-3" onerror="this.src='https://placehold.co/50x50/6C63FF/FFF?text=DP'">
                <h3 class="fw-bold">Create an Account</h3>
                <p class="text-muted">Join DiscoverPlay to track your games.</p>
            </div>
            
            <form id="register-form">
                <div class="mb-3">
                    <label for="username" class="form-label text-muted small">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="gamer123" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label text-muted small">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-muted small">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label text-muted small">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input bg-dark border-secondary" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">I agree to the <a href="terms.html" class="text-decoration-none" style="color: var(--dp-accent-secondary);">Terms of Service</a> and <a href="privacy.html" class="text-decoration-none" style="color: var(--dp-accent-secondary);">Privacy Policy</a>.</label>
                </div>
                <div id="register-message" class="small mb-3" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100 mb-4 py-2 fs-5" id="register-submit">Create Account</button>
            </form>

            <div class="text-center">
                <p class="text-muted mb-0">Already have an account? <a href="login.html" class="text-decoration-none fw-semibold" style="color: var(--dp-accent-secondary);">Log In</a></p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js?v=20260813-1"></script>
    <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = document.getElementById("register-message");
        const button = document.getElementById("register-submit");
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;
        if (password !== confirm) {
            message.className = "small mb-3 text-danger";
            message.textContent = "Passwords do not match.";
            return;
        }
        button.disabled = true;
        message.textContent = "";
        try {
            const result = await authRequest("/auth/register", { method: "POST", body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                password
            }) });
            message.className = "small mb-3 text-success";
            message.textContent = `Account created. Welcome, ${result.user.username}.`;
            setTimeout(() => window.location.href = "../index.html", 500);
        } catch (error) {
            message.className = "small mb-3 text-danger";
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
